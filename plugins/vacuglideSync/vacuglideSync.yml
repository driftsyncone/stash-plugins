name: VacuGlide Sync
description: Syncs a scene's funscript to an Autoblow VacuGlide through the Autoblow cloud API. Works from any browser, including phones.
version: 0.3.1
ui:
  javascript:
    - vacuglideSync.js
  css:
    - vacuglideSync.css
  csp:
    connect-src:
      - https://*.autoblowapi.com
settings:
  deviceToken:
    displayName: Device token
    description: Shown on the VacuGlide during Autoblow online setup. Can also be set from the VacuGlide panel on any scene.
    type: STRING
  autoLoad:
    displayName: Load script when a scene opens
    description: Off = load on first play or when you tap the VacuGlide badge. Loading can take up to 60 s the first time per scene.
    type: BOOLEAN
